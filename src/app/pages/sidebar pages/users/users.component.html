<h2>Our Admins</h2>
<div class="card">
    <div class="flex justify-end">
        <p-button label="Add Admin" [routerLink]="['/pages/admins', 'add']" class="ms-auto mb-5"
            [fluid]="false"></p-button>
    </div>

    <p-table #dt1 [value]="adminsList" dataKey="id" [rows]="10" [loading]="loading" [rowHover]="true"
        [showGridlines]="true" [paginator]="true" [globalFilterFields]="['id', 'name', 'email']"
        responsiveLayout="scroll">
        <ng-template #caption>
            <div class="flex justify-between items-center flex-column sm:flex-row">
                <button pButton label="Clear" class="p-button-outlined mb-2" icon="pi pi-filter-slash"
                    (click)="clear(dt1)"></button>
                <p-iconfield iconPosition="left" class="ml-auto">
                    <p-inputicon>
                        <i class="pi pi-search"></i>
                    </p-inputicon>
                    <input pInputText type="text" (input)="onGlobalFilter(dt1, $event)" placeholder="Search keyword" />
                </p-iconfield>
            </div>
        </ng-template>

        <ng-template #header>
            <tr>
                <th style="min-width: 8rem">
                    ID
                    <p-columnFilter type="text" field="id" display="menu" placeholder="Search by ID"></p-columnFilter>
                </th>
                <th style="min-width: 12rem">
                    Name
                    <p-columnFilter type="text" field="name" display="menu"
                        placeholder="Search by Name"></p-columnFilter>
                </th>
                <th style="min-width: 12rem">
                    Email
                    <p-columnFilter type="text" field="email" display="menu"
                        placeholder="Search by email"></p-columnFilter>
                </th>
                <th style="min-width: 12rem">
                    Created At
                </th>

                <th style="min-width: 12rem">
                    Actions
                </th>
            </tr>
        </ng-template>

        <ng-template #body let-admin>
            <tr>
                <td>{{ admin.id }}</td>
                <td>
                    <a [routerLink]="['/pages/admins', admin.id]">{{ admin.name | titlecase }}</a>
                </td>
                <td>
                    <a href="mailto:{{ admin.email}}">{{ admin.email}}</a>
                </td>
                <td>
                    {{admin.created_at | date:'MMM d, y' }}
                </td>

                <td class=" ">
                    <div class="flex justify-around self-stretch h-full">


                        <p-button icon="pi pi-pencil" [routerLink]="['/pages/admins', admin.id]"></p-button>
                        <p-button icon="pi pi-trash" severity="danger" (click)="openConfirmation(admin.id)"></p-button>

                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template #emptymessage>
            <tr>
                <td colspan="8">No admins found.</td>
            </tr>
        </ng-template>
        <ng-template #loadingbody>
            <tr>
                <td colspan="8">Loading admins data. Please wait.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog header="Confirmation" [(visible)]="displayConfirmation" [style]="{ width: '350px' }" [modal]="true">
    <div class="flex items-center justify-center">
        <i class="pi pi-exclamation-triangle mr-4" style="font-size: 2rem"></i>
        <span>Are you sure you want to delete this admin?</span>
    </div>
    <ng-template #footer>
        <p-button label="No" icon="pi pi-times" (click)="closeConfirmation(false)" text severity="secondary" />
        <p-button label="Yes" icon="pi pi-check" (click)="closeConfirmation(true)" severity="danger" outlined
            autofocus />
    </ng-template>
</p-dialog>
<p-toast></p-toast>
