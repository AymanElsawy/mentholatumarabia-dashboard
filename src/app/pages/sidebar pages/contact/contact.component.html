<h2>Our Contacts</h2>
<div class="card">
   
    <p-table #dt1 [value]="ContactList" dataKey="id" [rows]="10" [loading]="loading" [rowHover]="true" [showGridlines]="true" [paginator]="true" [globalFilterFields]="['id', 'name', 'email', 'type', 'reason']" responsiveLayout="scroll">
        <ng-template #caption>
            <div class="flex justify-between items-center flex-column sm:flex-row">
                <button pButton label="Clear" class="p-button-outlined mb-2" icon="pi pi-filter-slash" (click)="clear(dt1)"></button>
                <p-iconfield iconPosition="left" class="ml-auto">
                    <p-inputicon>
                        <i class="pi pi-search"></i>
                    </p-inputicon>
                    <input pInputText type="text" (input)="onGlobalFilter(dt1, $event)" placeholder="Search keyword" />
                </p-iconfield>
            </div>
        </ng-template>
        <ng-template #header>
            <tr>
                <th style="min-width: 12rem">
                    <div class="flex justify-between items-center">
                        Name
                        <p-columnFilter type="text" field="name" display="menu" placeholder="Search by name"></p-columnFilter>
                    </div>
                </th>
                <th style="min-width: 12rem">
                    <div class="flex justify-between items-center">
                        Email
                        <p-columnFilter type="text" field="email" display="menu" placeholder="Search by email"></p-columnFilter>
                    </div>
                </th>
                <th style="min-width: 12rem">
                    <div class="flex justify-between items-center">
                        Type
                        <p-columnFilter type="text" field="type" display="menu" placeholder="Search by type"></p-columnFilter>
                    </div>
                </th>
                <th style="min-width: 12rem">
                    <div class="flex justify-between items-center">
                        Reason
                        <p-columnFilter type="text" field="reason" display="menu" placeholder="Search by reason"></p-columnFilter>
                    </div>
                </th>
                <th style="min-width: 12rem">
                    <div class="flex justify-between items-center">Reply</div>
                </th>
            </tr>
        </ng-template>
        <ng-template #body let-contact>
            <tr>
                <td>
                    {{ contact.name }}
                </td>
                <td>
                    {{ contact.email }}
                </td>
                <td>
                    {{ contact.type }}
                </td>
                <td>
                    {{ contact.reason }}
                </td>
                <td class="flex justify-around">
                    <a [href]="'mailto:' + contact.email">
                        <p-button icon="pi pi-pencil" label="Reply" />
                    </a>
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="8">No Contacts found.</td>
            </tr>
        </ng-template>
        <ng-template #loadingbody>
            <tr>
                <td colspan="8">Loading Contacts data. Please wait.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
